<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colorblind">
<title>Colorblind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090b; --sheet:#15171b; --accent:#f5a623;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:var(--sans)}
  body{overscroll-behavior:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  #app{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;
      transform-origin:50% 50%;transition:transform .12s linear}
  #vignette{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(78% 58% at 50% 42%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
  #vid,#sampler,#demo{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px}

  /* ---- top chrome ---- */
  #top{position:absolute;left:0;right:0;top:calc(18px + env(safe-area-inset-top));
       display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:20}
  #avatar{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;
          font:700 17px/1 var(--sans);color:#141414;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
  #top .actions{display:flex;align-items:center;gap:9px}
  .glass{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;
         background:rgba(8,9,11,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

  /* ---- reticle + readout ---- */
  #center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
          display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none;z-index:15}
  #reticle{position:relative;width:116px;height:116px;border-radius:999px;border:2px solid rgba(255,255,255,.92);
           box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 7px rgba(0,0,0,.18)}
  #reticle i{position:absolute;background:rgba(255,255,255,.9)}
  #reticle .dot{left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:999px;
                background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  #reticle .l{left:-1px;top:50%;width:9px;height:2px}
  #reticle .r{right:-1px;top:50%;width:9px;height:2px}
  #reticle .t{top:-1px;left:50%;height:9px;width:2px}
  #reticle .b{bottom:-1px;left:50%;height:9px;width:2px}
  #readout{display:flex;align-items:center;gap:10px;padding:9px 15px 9px 10px;border-radius:999px;
           background:rgba(8,9,11,.74);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
           border:1px solid rgba(255,255,255,.14);max-width:88vw}
  #swatch{width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);background:#808080}
  #cname{font:600 15px/1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
  #chex{font:400 11px/1 var(--mono);color:rgba(255,255,255,.45)}

  /* ---- bottom chrome ---- */
  #bottom{position:absolute;left:0;right:0;bottom:0;padding:60px 20px calc(30px + env(safe-area-inset-bottom));
          display:flex;flex-direction:column;align-items:center;gap:14px;z-index:20;pointer-events:none;
          background:linear-gradient(to top,rgba(8,9,11,.8),rgba(8,9,11,0))}
  #modeName{padding:13px 24px;border-radius:999px;font:700 18px/1 var(--sans);letter-spacing:-.01em;
            white-space:nowrap;background:rgba(8,9,11,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  #modes{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .mode{display:flex;flex-direction:column;align-items:center;gap:9px}
  .chip{width:62px;height:62px;border-radius:22px;display:flex;align-items:center;justify-content:center;
        transition:box-shadow .25s,transform .25s,background .12s;transform:scale(.88);
        box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  .mode[aria-pressed="true"] .chip{transform:scale(1);box-shadow:0 0 0 3px #fff}
  .ico{height:18px;display:flex;align-items:center;justify-content:center;
       font:700 15px/1 var(--sans);color:#fff;opacity:.42;transition:opacity .25s}
  .mode[aria-pressed="true"] .ico{opacity:1}

  /* ---- toast ---- */
  #toast{position:absolute;left:50%;top:62%;transform:translateX(-50%);padding:11px 20px;border-radius:999px;
         background:rgba(8,9,11,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
         font:600 15px/1 var(--mono);z-index:60;pointer-events:none;transition:opacity .2s;opacity:0}

  /* ---- sheet ---- */
  #scrim{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.5);transition:opacity .28s;opacity:0;pointer-events:none}
  #scrim.on{opacity:1;pointer-events:auto}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:80;max-height:82%;display:flex;flex-direction:column;
         padding:14px 22px calc(34px + env(safe-area-inset-bottom));border-radius:36px 36px 0 0;background:var(--sheet);
         box-shadow:0 -20px 60px rgba(0,0,0,.6);transition:transform .34s cubic-bezier(.22,1,.3,1);transform:translateY(106%)}
  #sheet.on{transform:translateY(0)}
  #grab{width:38px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);margin:0 auto 20px;flex:none}
  #sheetBody{display:flex;flex-direction:column;gap:22px;overflow-x:hidden;overflow-y:auto;padding-bottom:8px}
  .row{display:flex;flex-direction:column;gap:11px}
  .rowhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .label{font:600 11px/1 var(--mono);letter-spacing:.14em;color:rgba(255,255,255,.42)}
  .hint{font:400 11px/1.4 var(--sans);color:rgba(255,255,255,.3);text-align:right}
  .val{font:500 13px/1 var(--mono);color:var(--accent)}
  .rule{height:1px;background:rgba(255,255,255,.08)}
  #avatarBig{width:56px;height:56px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;
             font:700 25px/1 var(--sans);color:#141414;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
  #letter{width:62px;padding:11px 0;text-align:center;border-radius:12px;border:1px solid rgba(255,255,255,.14);
          background:rgba(255,255,255,.05);color:#fff;font:600 17px/1 var(--sans);outline:none}
  #bgs{display:grid;grid-template-columns:repeat(3,28px);gap:8px}
  #bgs button{width:28px;height:28px;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  #bgs button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff}
  select,input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
  select{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
         background:rgba(255,255,255,.05);color:#fff;font:500 14px/1 var(--sans);outline:none;appearance:none}
  .btns{display:flex;gap:10px}
  .btns button{flex:1;padding:14px;border-radius:14px;text-align:center;font:600 13px/1 var(--sans)}
  #camBtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
  #doneBtn{background:var(--accent);color:#141414}
  #note{font:400 11px/1.5 var(--sans);color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="vignette"></div>

  <div id="top" data-chrome>
    <button id="avatar" aria-label="Profile">Z</button>
    <div class="actions">
      <button id="save" class="glass" aria-label="Save frame">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5">
          <path d="M8 1.8v8.4M4.8 7l3.2 3.2L11.2 7"/>
          <path d="M2.2 11.6v1.1a1.6 1.6 0 001.6 1.6h8.4a1.6 1.6 0 001.6-1.6v-1.1"/></svg>
      </button>
      <button id="gear" class="glass" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.6"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M12.9 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>

  <div id="center">
    <div id="reticle">
      <i class="dot"></i><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i>
    </div>
    <div id="readout">
      <div id="swatch"></div>
      <div id="cname">starting…</div>
      <div id="chex"></div>
    </div>
  </div>

  <div id="bottom">
    <div id="modeName">Z's mode</div>
    <div id="modes" data-chrome>
      <button class="mode" data-mode="0" aria-pressed="true"><span class="chip"></span><span class="ico" id="ico0">Z</span></button>
      <button class="mode" data-mode="1" aria-pressed="false"><span class="chip"></span><span class="ico">
        <svg width="20" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M1.6 10S4.8 4.6 10 4.6 18.4 10 18.4 10 15.2 15.4 10 15.4 1.6 10 1.6 10z"/><circle cx="10" cy="10" r="2.4"/></svg></span></button>
      <button class="mode" data-mode="2" aria-pressed="false"><span class="chip"></span><span class="ico">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1.6" y="4.2" width="14.8" height="11" rx="3"/><circle cx="9" cy="9.7" r="3.1"/></svg></span></button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="scrim" data-chrome></div>

  <section id="sheet" data-chrome>
    <div id="grab"></div>
    <div id="sheetBody">

      <div class="row">
        <div class="rowhead"><div class="label">PROFILE</div><div class="hint">their letter, their colour</div></div>
        <div style="display:flex;align-items:center;gap:14px">
          <div id="avatarBig">Z</div>
          <input id="letter" value="Z" maxlength="2" aria-label="Initial">
          <div id="bgs"></div>
        </div>
      </div>

      <div class="rule"></div>

      <div class="row">
        <div class="rowhead"><div class="label">VISION</div><div class="hint" id="typeHint"></div></div>
        <select id="type" aria-label="Type of colour vision"></select>
      </div>

      <div class="row">
        <div class="rowhead"><div class="label">SEVERITY</div><div class="val" id="sevLabel">0.90</div></div>
        <input id="sev" type="range" min="0" max="1" step="0.01" value="0.9">
      </div>

      <div class="row">
        <div class="rowhead"><div class="label">STRENGTH</div><div class="val" id="strLabel">0.60</div></div>
        <input id="str" type="range" min="0" max="1" step="0.02" value="0.6">
      </div>

      <div class="rule"></div>
      <div id="note"></div>

      <div class="btns">
        <button id="camBtn">Use camera</button>
        <button id="doneBtn">Done</button>
      </div>
    </div>
  </section>
</div>

<video id="vid" playsinline muted autoplay></video>
<canvas id="sampler" width="32" height="32"></canvas>
<canvas id="demo" width="804" height="1748"></canvas>

<script type="module" src="./src/app.js"></script>
</body>
</html>
